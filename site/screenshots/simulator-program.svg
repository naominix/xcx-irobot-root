<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Rootシミュレーター用Scratchプログラム</title>
  <desc id="desc">緑の旗、シミュレーター、マーカー、青色LED、ナビ移動を並べたScratchブロック</desc>
  <rect width="1200" height="760" fill="#f7f8fb"/>
  <rect width="1200" height="64" fill="#7657c9"/>
  <text x="28" y="41" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="700">Xcratch</text>
  <text x="180" y="40" fill="#eeeaff" font-family="Arial, sans-serif" font-size="18">ファイル　　編集　　Rootをコントローラーに</text>
  <rect x="20" y="88" width="270" height="640" rx="12" fill="#fff" stroke="#d9dce5"/>
  <rect x="34" y="108" width="240" height="50" rx="10" fill="#59bb92"/>
  <text x="50" y="141" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="700">iRobot Root</text>
  <rect x="310" y="88" width="870" height="640" rx="12" fill="white" stroke="#d9dce5"/>
  <text x="338" y="126" fill="#596775" font-family="Arial, sans-serif" font-size="16">シミュレーターの動きを確認するプログラム</text>
  <!-- Scratch stack -->
  <path d="M360 156h260a16 16 0 0 1 16 16v30h-24v14h-40v-14H360a16 16 0 0 1-16-16v-14a16 16 0 0 1 16-16z" fill="#4c97ff"/>
  <text x="380" y="190" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="700">緑の旗が押された時</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="360" y="218" width="430" height="48" rx="10" fill="#f6c945"/><text x="382" y="249" fill="white">制御モードを　シミュレーター　にする</text>
    <rect x="360" y="274" width="330" height="48" rx="10" fill="#59bb92"/><text x="382" y="305" fill="white">マーカーを　下げる</text>
    <rect x="360" y="330" width="470" height="48" rx="10" fill="#59bb92"/><text x="382" y="361" fill="white">LEDを　回転　で</text><circle cx="770" cy="354" r="15" fill="#3285ff" stroke="white" stroke-width="3"/><text x="796" y="361" fill="white">青　にする</text>
    <rect x="360" y="386" width="280" height="48" rx="10" fill="#59bb92"/><text x="382" y="417" fill="white">ナビをリセットする</text>
    <rect x="360" y="442" width="440" height="48" rx="10" fill="#59bb92"/><text x="382" y="473" fill="white">ナビで x</text><rect x="500" y="451" width="48" height="30" rx="12" fill="white"/><text x="514" y="473" fill="#4b5563">10</text><text x="559" y="473" fill="white"> y</text><rect x="595" y="451" width="48" height="30" rx="12" fill="white"/><text x="608" y="473" fill="#4b5563">10</text><text x="655" y="473" fill="white"> cmへ移動する</text>
    <rect x="360" y="498" width="440" height="48" rx="10" fill="#59bb92"/><text x="382" y="529" fill="white">ナビで x</text><rect x="500" y="507" width="48" height="30" rx="12" fill="white"/><text x="516" y="529" fill="#4b5563">0</text><text x="559" y="529" fill="white"> y</text><rect x="595" y="507" width="48" height="30" rx="12" fill="white"/><text x="611" y="529" fill="#4b5563">10</text><text x="655" y="529" fill="white"> cmへ移動する</text>
    <rect x="360" y="554" width="440" height="48" rx="10" fill="#59bb92"/><text x="382" y="585" fill="white">ナビで x</text><rect x="500" y="563" width="48" height="30" rx="12" fill="white"/><text x="516" y="585" fill="#4b5563">0</text><text x="559" y="585" fill="white"> y</text><rect x="595" y="563" width="48" height="30" rx="12" fill="white"/><text x="611" y="585" fill="#4b5563">0</text><text x="655" y="585" fill="white"> cmへ移動する</text>
    <rect x="360" y="610" width="330" height="48" rx="10" fill="#59bb92"/><text x="382" y="641" fill="white">マーカーを　上げる</text>
  </g>
  <text x="930" y="704" fill="#7b8490" font-family="Arial, sans-serif" font-size="15">Root simulator sample</text>
</svg>
