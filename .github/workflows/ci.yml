name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Checkout Xcratch editor
        uses: actions/checkout@v4
        with:
          repository: xcratch/scratch-editor
          path: scratch-editor

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extension

      - name: Link Scratch VM sources
        run: npm run setup-dev -- ../scratch-editor/packages/scratch-vm
        working-directory: extension

      - name: Test
        run: npm test -- --runInBand
        working-directory: extension

      - name: Build
        run: npm run build
        working-directory: extension
